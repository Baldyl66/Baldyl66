<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230">
  <style>
  .fade { opacity: 0; animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .pulse { animation: pulse 3.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
</style>
  
  <defs>
    <radialGradient id="glowp1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(50.4 0) scale(294.0 253.00000000000003)">
      <stop offset="0" stop-color="#6366F1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweepp1" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#818CF8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-420 0; 420 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="418" height="228" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1" y="1" width="418" height="228" rx="16" fill="url(#glowp1)"/>
  <rect x="1" y="1" width="418" height="228" rx="16" fill="none" stroke="url(#sweepp1)" stroke-width="1.5"/>

  <g class="fade">
    <rect x="28" y="28" width="44" height="44" rx="12" fill="#6366F1" fill-opacity=".15" stroke="#6366F1" stroke-opacity=".4"/>
    <g transform="translate(38 38) scale(1.0)" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></g>
    <text x="86" y="48" class="sans" font-size="19" font-weight="700" fill="#F8FAFC">Panelys</text>
    <text x="86" y="68" class="mono" font-size="10.5" letter-spacing="1.6" fill="#818CF8">PERSONAL DATA DASHBOARD</text>
  </g>
  <rect x="28" y="92" width="364" height="1" fill="#1E293B"/>
  <g class="fade" style="animation-delay:.2s"><text x="28" y="124" class="sans" font-size="13.5" fill="#94A3B8">A dashboard that brings personal information</text><text x="28" y="145" class="sans" font-size="13.5" fill="#94A3B8">together in a clean, intuitive interface.</text></g>
  <g class="fade" style="animation-delay:.4s"><rect x="28" y="186" width="85" height="24" rx="12" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".35"/><text x="70.5" y="202" text-anchor="middle" class="mono" font-size="11" fill="#C7D2FE">Dashboard</text><rect x="121" y="186" width="50" height="24" rx="12" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".35"/><text x="146.0" y="202" text-anchor="middle" class="mono" font-size="11" fill="#C7D2FE">Data</text><rect x="179" y="186" width="92" height="24" rx="12" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".35"/><text x="225.0" y="202" text-anchor="middle" class="mono" font-size="11" fill="#C7D2FE">Automation</text></g>
