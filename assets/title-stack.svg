  .pulse { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .gp { animation: gp 3.2s steps(1) infinite; }
  .gc { animation: gc 3.2s steps(1) infinite; }
  @keyframes gp { 0%,86%,100% { transform: translate(0,0); opacity: .0; } 88% { transform: translate(-6px,2px); opacity: .9; } 91% { transform: translate(5px,-2px); opacity: .9; } 94% { transform: translate(-3px,0); opacity: .9; } }
  @keyframes gc { 0%,86%,100% { transform: translate(0,0); opacity: .0; } 88% { transform: translate(6px,-2px); opacity: .9; } 91% { transform: translate(-5px,2px); opacity: .9; } 94% { transform: translate(3px,1px); opacity: .9; } }
  .drip { animation: drip 6s ease-in infinite; }
  @keyframes drip { 0% { transform: scaleY(0); } 60%,100% { transform: scaleY(1); } }

    .t { fill: #8F86B8; }
    @media (prefers-color-scheme: dark) { .t { fill: #F5F3FF; } }
