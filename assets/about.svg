  <g class="in" style="animation-delay:.25s"><text x="44" y="166" class="sans" font-size="15" fill="#A9A3C7">I build original software, from mobile and web apps</text><text x="44" y="190" class="sans" font-size="15" fill="#A9A3C7">to games and creative tools. I love turning wild</text><text x="44" y="214" class="sans" font-size="15" fill="#A9A3C7">concepts into polished, functional products, with a</text><text x="44" y="238" class="sans" font-size="15" fill="#A9A3C7">strong focus on user experience and clean</text><text x="44" y="262" class="sans" font-size="15" fill="#A9A3C7">architecture.</text></g>
