  <g class="fade" style="animation-delay:.25s"><text x="40" y="118" class="sans" font-size="15" fill="#94A3B8">I build original software, from mobile and web apps</text><text x="40" y="142" class="sans" font-size="15" fill="#94A3B8">to games and creative tools. I love turning concepts</text><text x="40" y="166" class="sans" font-size="15" fill="#94A3B8">into polished, functional products, with a strong</text><text x="40" y="190" class="sans" font-size="15" fill="#94A3B8">focus on user experience and clean architecture.</text></g>
