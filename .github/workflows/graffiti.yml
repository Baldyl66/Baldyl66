name: Spray graffiti wall

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/graffiti.py"
      - ".github/workflows/graffiti.yml"

permissions:
  contents: write

jobs:
  spray:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fontTools
        run: pip install fonttools
      - name: Draw the wall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/graffiti.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neon/graffiti.svg
          git diff --cached --quiet || git commit -m "Spray graffiti wall [skip ci]"
          git pull --rebase
          git push
